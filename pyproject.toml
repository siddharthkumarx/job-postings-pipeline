[project]
name = "job-postings-pipeline"
version = "0.1.0"
description = "Daily hiring-data pipeline for US tech companies from official public job-board APIs, loaded into a DuckDB + dbt warehouse."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Siddharth Kumar" }]
dependencies = [
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "duckdb>=1.4",
    "httpx>=0.28.1,<0.29",
    "pyarrow>=26,<27",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
jobpipe = "jobpipe.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "respx>=0.23",
    "ruff>=0.17",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jobpipe"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = ["S101", "RUF001", "RUF003", "PT018"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"scripts/**" = ["S603", "S607"]
# The page template is HTML: long lines are clearer than split strings.
"src/jobpipe/site/build.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["jobpipe"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "duckdb", "dbt.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
