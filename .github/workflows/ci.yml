name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No attribution lines in commit messages
        run: python3 scripts/check_commit_messages.py
      - name: Every tracked file under 50 MB
        run: python3 scripts/check_file_sizes.py
      - name: Internal links in Markdown
        run: python3 scripts/check_links.py

  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff
        run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - name: mypy
        run: uv run --no-sync mypy
      - name: pytest
        run: uv run --no-sync pytest -p no:logging
      - name: dbt build on synthetic fixtures
        run: uv run --no-sync jobpipe fixtures-build --dir "$RUNNER_TEMP/fixtures"
      - name: pip-audit
        run: uv export --frozen --format requirements-txt --no-emit-project > "$RUNNER_TEMP/req.txt" && uvx pip-audit==2.10.1 --strict -r "$RUNNER_TEMP/req.txt"

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          V: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSLO "${base}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSLO "${base}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
