# Live checks: the development sandbox cannot reach the job boards, so every
# live check is requested by changing checks/request.yml on a branch. This
# workflow runs it and commits the results under checks/results/<id>/ to the
# same branch.
name: checks

on:
  push:
    paths:
      - checks/request.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --no-dev
      - name: Run check
        id: run
        continue-on-error: true
        run: uv run --no-sync jobpipe checks checks/request.yml
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checks/results
          if git diff --cached --quiet; then
            echo "no results to commit"; exit 0
          fi
          id=$(python3 -c "import yaml,sys;print(yaml.safe_load(open('checks/request.yml'))['id'])" 2>/dev/null || echo unknown)
          git commit -m "checks: results for ${id}"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
      - name: Fail if the check failed
        if: steps.run.outcome == 'failure'
        run: exit 1
