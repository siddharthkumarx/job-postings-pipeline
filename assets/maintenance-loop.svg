<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d"><title id="t">Maintenance loop: daily runs, a real incident, fixed, data keeps arriving</title><desc id="d">Animated: one square per pipeline run, the latest 14 of 24; 2 held or failed so far. Incident 2026-11-04: One job ad wrote its salary as &quot;140.000.00&quot;. The salary reader did not expect that format and stopped the whole first run. Fix: It now reads that format. One odd ad can only skip itself and can never stop a run again. A test guards it. Latest run (2026-11-20): 1,493 of 1,500 job boards read.</desc><style>@font-face{font-family:'Plus Jakarta Sans';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Plus Jakarta Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}text{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}.beat{animation:10.0s linear infinite}.b1{opacity:0;animation-name:k1}@keyframes k1{0%{opacity:0}0.00%{opacity:0}3.50%{opacity:1}21.17%{opacity:1}24.67%{opacity:0}100%{opacity:0}}.b2{opacity:0;animation-name:k2}@keyframes k2{0%{opacity:0}24.67%{opacity:0}28.17%{opacity:1}45.83%{opacity:1}49.33%{opacity:0}100%{opacity:0}}.b3{opacity:0;animation-name:k3}@keyframes k3{0%{opacity:0}49.33%{opacity:0}52.83%{opacity:1}70.50%{opacity:1}74.00%{opacity:0}100%{opacity:0}}.b4{opacity:1;animation-name:k4}@keyframes k4{0%{opacity:0}74.00%{opacity:0}77.50%{opacity:1}100%{opacity:1}}*{animation-delay:-7.80s!important}@media (prefers-reduced-motion: reduce){*{animation:none!important}.b1{opacity:0!important}.b2{opacity:0!important}.b3{opacity:0!important}.b4{opacity:1!important}.row{opacity:1!important}.bar{transform:none!important}.st{stroke:#0B7468!important}}</style><rect x="1" y="1" width="998" height="398" rx="14" fill="#F3F8F7" stroke="#E2EAE8" stroke-width="2"/><rect x="101.0" y="40" width="44" height="44" rx="8" fill="#0E8A7D"/><rect x="159.0" y="40" widt