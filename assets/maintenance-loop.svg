<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d"><title id="t">Maintenance loop: daily runs, a real incident, fixed, data keeps arriving</title><desc id="d">Animated: one square per pipeline run (6 so far). Incident 2026-11-04: One job ad wrote its salary as &quot;140.000.00&quot;. The salary reader did not expect that format and stopped the whole first run. Fix: It now reads that format. One odd ad can only skip itself and can never stop a run again. A test guards it. Latest run (2026-11-04) read every tracked job board and collected 64,349 jobs.</desc><style>@font-face{font-family:'Instrument Sans';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Instrument Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}.beat{animation:10.0s linear infinite}.b1{opacity:0;animation-name:k1}@keyframes k1{0%{opacity:0}0.00%{opacity:0}3.50%{opacity:1}21.17%{opacity:1}24.67%{opacity:0}100%{opacity:0}}.b2{opacity:0;animation-name:k2}@keyframes k2{0%{opacity:0}24.67%{opacity:0}28.17%{opacity:1}45.83%{opacity:1}49.33%{opacity:0}100%{opacity:0}}.b3{opacity:0;animation-name:k3}@keyframes k3{0%{opacity:0}49.33%{opacity:0}52.83%{opacity:1}70.50%{opacity:1}74.00%{opacity:0}100%{opacity:0}}.b4{opacity:1;animation-name:k4}@keyframes k4{0%{opacity:0}74.00%{opacity:0}77.50%{opacity:1}100%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.b1{opacity:0}.b2{opacity:0}.b3{opacity:0}.b4{opacity:1}.still{opacity:1!important;transform:none!important}}.hl{stroke:#EAF2F0;stroke-width:3}</style><rect width="1000" height="420" rx="16" fill="#0B1416"/><rect class="sq hl" x="333.0" y="60" width="44" height="44" rx="8" fill="#E9A93C"/><rect class="sq" x="391.0" y="60" width="44" height="44" rx="8" fill="#E9A93C"/><rect class="sq" x="449.0" y="60" width="44" height="44" rx="8" fill="#2FBFAE"/><rect class="sq" x="507.0" y="60" width="44" height="44" rx="8" fill="#2FBFAE"/><rect class="sq" x="565.0" y="60" width="44" height="44" rx="8" fill="#2FBFAE"/><rect class="sq" x="623.0" y="60" width="44" height="44" rx="8" fill="#2FBFAE"/><g class="beat b1"><text x="500.0" y="220.0" font-family="Instrument Sans" font-weight="600" font-size="36" fill="#EAF2F0" text-anchor="middle">A fresh run every morning.</text><text x="500.0" y="268.0" font-family="IBM Plex Mono" font-weight="400" font-size="24" fill="#7E9996" text-anchor="middle">6 runs so far · amber = held or failed</text></g><g class="beat b2"><text x="500.0" y="200.0" font-family="Instrument Sans" font-weight="600" font-size="28" fill="#E9A93C" text-anchor="middle">2026-11-04: An odd salary format stopped the first run</text><text x="500.0" y="250.0" font-family="Instrument Sans" font-weight="400" font-size="24" fill="#C9D8D5" text-anchor="middle">One job ad wrote its salary as &quot;140.000.00&quot;. The salary reader did</text><text x="500.0" y="286.0" font-family="Instrument Sans" font-weight="400" font-size="24" fill="#C9D8D5" text-anchor="middle">not expect that format and stopped the whole first run.</text></g><g class="beat b3"><text x="500.0" y="200.0" font-family="Instrument Sans" font-weight="600" font-size="30" fill="#2FBFAE" text-anchor="middle">Fixed the same day.</text><text x="500.0" y="250.0" font-family="Instrument Sans" font-weight="400" font-size="24" fill="#C9D8D5" text-anchor="middle">It now reads that format. One odd ad can only skip itself and can</text><text x="500.0" y="286.0" font-family="Instrument Sans" font-weight="400" font-size="24" fill="#C9D8D5" text-anchor="middle">never stop a run again. A test guards it.</text></g><g class="beat b4"><text x="500.0" y="250.0" font-family="Instrument Sans" font-weight="600" font-size="88" fill="#2FBFAE" text-anchor="middle">1,500 of 1,500</text><text x="500.0" y="305.0" font-family="Instrument Sans" font-weight="400" font-size="26" fill="#EAF2F0" text-anchor="middle">job boards read in the latest run · 2026-11-04</text></g></svg>